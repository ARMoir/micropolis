name: Micropolis Tandy EX (16-bit DOS)

on:
  push:
    branches: [master]
    paths:
      - 'tandy-dos/**'
      - 'resources/sc2k-buildings/**'
      - '.github/workflows/tandy-dos.yml'
  pull_request:
    branches: [master]
    paths:
      - 'tandy-dos/**'
      - 'resources/sc2k-buildings/**'
      - '.github/workflows/tandy-dos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate city files and cross-compile 8086 DOS EXE
    runs-on: ubuntu-latest
    steps:
      - name: Check out Micropolis
        uses: actions/checkout@v4

      - name: Check original Micropolis city-file parser
        run: |
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-small-lot-art tandy-dos/small_lot_art.c tandy-dos/tests/test_small_lot_art.c
          ./test-small-lot-art
          python3 tandy-dos/tests/test_sc2k_converter.py
          python3 tandy-dos/tests/test_sc2k_resources.py
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-city tandy-dos/city.c tandy-dos/tests/test_city.c
          ./test-city micropolis-activity/cities/happisle.cty
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-editor tandy-dos/city.c tandy-dos/zoning.c tandy-dos/newer_lot.c tandy-dos/editor.c tandy-dos/connections.c tandy-dos/infrastructure.c tandy-dos/tests/test_editor.c
          ./test-editor
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-connections tandy-dos/city.c tandy-dos/zoning.c tandy-dos/newer_lot.c tandy-dos/editor.c tandy-dos/connections.c tandy-dos/infrastructure.c tandy-dos/tests/test_connections.c
          ./test-connections
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-crossings tandy-dos/city.c tandy-dos/editor.c \
            tandy-dos/connections.c tandy-dos/infrastructure.c \
            tandy-dos/placement.c tandy-dos/zoning.c tandy-dos/newer_lot.c tandy-dos/engine.c \
            tandy-dos/tests/test_crossings.c
          ./test-crossings
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-engine tandy-dos/city.c tandy-dos/zoning.c tandy-dos/newer_lot.c \
            tandy-dos/engine.c tandy-dos/tests/test_engine.c
          ./test-engine
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-ui tandy-dos/ui.c tandy-dos/tests/test_ui.c
          ./test-ui
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-pointer-policy tandy-dos/tests/test_pointer_policy.c
          ./test-pointer-policy
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-tool-picker tandy-dos/tests/test_tool_picker.c
          ./test-tool-picker
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-tool-art tandy-dos/tool_art.c tandy-dos/ui.c \
            tandy-dos/tests/test_tool_art.c
          ./test-tool-art
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-view-rotation tandy-dos/city.c \
            tandy-dos/view_rotation.c tandy-dos/tests/test_view_rotation.c
          ./test-view-rotation
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-menu-font tandy-dos/menu_font.c tandy-dos/ui.c tandy-dos/tests/test_menu_font.c
          ./test-menu-font
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-video-ops tandy-dos/video_ops.c tandy-dos/tests/test_video_ops.c
          ./test-video-ops
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-vga tandy-dos/video_ops.c tandy-dos/tests/test_vga.c
          ./test-vga
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-ground tandy-dos/ground.c tandy-dos/city.c \
            tandy-dos/zoning.c tandy-dos/newer_lot.c tandy-dos/tests/test_ground.c
          ./test-ground
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-zoning tandy-dos/city.c tandy-dos/zoning.c tandy-dos/newer_lot.c tandy-dos/tests/test_zoning.c
          ./test-zoning
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-newer-lot tandy-dos/city.c tandy-dos/zoning.c \
            tandy-dos/newer_lot.c tandy-dos/editor.c \
            tandy-dos/connections.c tandy-dos/infrastructure.c \
            tandy-dos/tests/test_newer_lot.c
          ./test-newer-lot
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-source-mix tandy-dos/city.c tandy-dos/zoning.c \
            tandy-dos/newer_lot.c tandy-dos/tests/test_source_mix.c
          ./test-source-mix
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-game-save tandy-dos/city.c tandy-dos/zoning.c \
            tandy-dos/newer_lot.c tandy-dos/game_save.c \
            tandy-dos/tests/test_game_save.c
          ./test-game-save
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-newer-site tandy-dos/city.c tandy-dos/view_rotation.c \
            tandy-dos/newer_site.c tandy-dos/tests/test_newer_site.c
          ./test-newer-site
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-zone-highlight tandy-dos/city.c tandy-dos/zoning.c \
            tandy-dos/newer_lot.c tandy-dos/view_rotation.c \
            tandy-dos/zone_highlight.c tandy-dos/tests/test_zone_highlight.c
          ./test-zone-highlight
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-stadium-fx tandy-dos/city.c tandy-dos/view_rotation.c \
            tandy-dos/stadium_fx.c tandy-dos/tests/test_stadium_fx.c
          ./test-stadium-fx
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-placement tandy-dos/city.c tandy-dos/zoning.c tandy-dos/newer_lot.c \
            tandy-dos/editor.c tandy-dos/connections.c \
            tandy-dos/placement.c tandy-dos/infrastructure.c tandy-dos/tests/test_placement.c
          ./test-placement
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-simulation tandy-dos/city.c tandy-dos/zoning.c tandy-dos/newer_lot.c \
            tandy-dos/engine.c tandy-dos/simulation.c \
            tandy-dos/tests/test_simulation.c
          ./test-simulation micropolis-activity/cities/happisle.cty
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-tile-inspect tandy-dos/city.c tandy-dos/zoning.c \
            tandy-dos/newer_lot.c tandy-dos/engine.c \
            tandy-dos/simulation.c tandy-dos/tile_inspect.c \
            tandy-dos/tests/test_tile_inspect.c
          ./test-tile-inspect

      - name: Convert original Micropolis tile art to Tandy format
        run: |
          # Use the checked-in 1x1 art as the source, but do not
          # generate or distribute its obsolete runtime filename.
          cp resources/sc2k-buildings/SC2K.DAT NEWER1.DAT
          cp resources/sc2k-buildings/SC2KM8.DAT NEWERM8.DAT
          cmp -s NEWER1.DAT resources/sc2k-buildings/SC2K.DAT
          test ! -e SC2K.DAT
          test "$(wc -c < NEWERM8.DAT)" -eq 25504
          python3 tandy-dos/tools/convert_tiles.py micropolis-activity/images/tiles.xpm TILES.DAT
          test "$(wc -c < TILES.DAT)" -eq 30720
          python3 tandy-dos/tests/test_tile_palette.py micropolis-activity/images/tiles.xpm TILES.DAT
          python3 - <<'PY'
          from pathlib import Path
          tiles = Path("TILES.DAT").read_bytes()
          def tile(n):
              return tiles[n * 32 : (n + 1) * 32]
          assert tile(67) == tile(83) == tile(99) == tile(195), "vertical traffic smoothing mismatch"
          assert tile(66) != tile(67), "horizontal and vertical streets must differ"
          def pixel(n, x, y):
              packed = tile(n)[y * 4 + x // 2]
              return (packed & 15) if x & 1 else (packed >> 4)
          # Original 16x16 tile 66 has white dashes on row 7 only.
          # A plain 2x2 majority downscale erased all four dashes.
          for n in (64, 66, 74, 80, 82):
              assert [pixel(n, x, 3) for x in (1, 2, 5, 6)] == [15] * 4, (
                  f"missing horizontal centerline on road tile {n}"
              )
              assert pixel(n, 0, 3) != 15, f"centerline too wide on {n}"
          # T-junction tile 72 offsets the painted stripe by one source pixel.
          assert [pixel(72, x, 3) for x in (2, 5, 6)] == [15] * 3
          assert tile(67) == tile(83), "vertical road fix must remain intact"
          print("Horizontal and vertical traffic tile regression tests passed")
          PY
          # Bundle the Tandy road-based edition of Happisle, not the
          # original railway-heavy Micropolis sample. The original is
          # kept intact for upstream-compatible city/simulation tests.
          python3 tandy-dos/tools/convert_happisle_rails.py \
            micropolis-activity/cities/happisle.cty HAPPISLE.CTY
          python3 tandy-dos/tests/test_happisle_road_conversion.py \
            micropolis-activity/cities/happisle.cty HAPPISLE.CTY
          test "$(wc -c < HAPPISLE.CTY)" -eq 27120

      - name: Build and validate VGA-specific source artwork
        run: |
          python3 tandy-dos/tools/convert_vga.py
          cc -std=c89 -Wall -Wextra -pedantic \
            -o test-vga-art tandy-dos/vga_art.c tandy-dos/video_ops.c \
            tandy-dos/tests/test_vga_art.c
          ./test-vga-art

      - name: Set up Open Watcom (16-bit DOS)
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0'
          target: dos

      - name: Build native 8086-compatible DOS executable
        run: |
          wcl -bcl=dos -0 -ml -q -fe=MICROPOL.EXE \
             tandy-dos/tandy.c tandy-dos/vga_art.c tandy-dos/ground.c tandy-dos/city.c tandy-dos/game_save.c tandy-dos/tile_inspect.c tandy-dos/editor.c tandy-dos/connections.c tandy-dos/engine.c \
             tandy-dos/ui.c tandy-dos/mouse.c tandy-dos/zoning.c tandy-dos/newer_lot.c tandy-dos/newer_site.c tandy-dos/zone_highlight.c \
            tandy-dos/placement.c tandy-dos/simulation.c tandy-dos/stadium_fx.c tandy-dos/video_ops.c tandy-dos/menu_font.c tandy-dos/view_rotation.c tandy-dos/tool_art.c tandy-dos/infrastructure.c tandy-dos/small_lot_art.c
          test -s MICROPOL.EXE
          file MICROPOL.EXE

      - name: Smoke-test VGA and Tandy autodetection in DOSBox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dosbox xvfb
          mkdir -p /tmp/micropol-smoke
          cp MICROPOL.EXE TILES.DAT NEWER1.DAT NEWERM8.DAT VGATILES.DAT VGANEWER.DAT VGA.PAL /tmp/micropol-smoke/
          for machine in vgaonly tandy; do
            printf '[dosbox]\nmachine=%s\n[cpu]\ncycles=max\n[sdl]\noutput=surface\n' "$machine" > /tmp/micropol-smoke.conf
            SDL_AUDIODRIVER=dummy timeout 90s xvfb-run -a dosbox \
              -conf /tmp/micropol-smoke.conf \
              -c "mount c /tmp/micropol-smoke" -c "c:" \
              -c "micropol /timedemo > auto.txt" \
              -c "micropol /$([ "$machine" = vgaonly ] && echo vga || echo tandy) /timedemo > force.txt" \
              -c "exit"
            cat /tmp/micropol-smoke/AUTO.TXT /tmp/micropol-smoke/FORCE.TXT
            if [ "$machine" = vgaonly ]; then expected=VGA; else expected=Tandy; fi
            grep -q "Video: $expected 320x200" /tmp/micropol-smoke/AUTO.TXT
            grep -q "Video: $expected 320x200" /tmp/micropol-smoke/FORCE.TXT
            if [ "$machine" = vgaonly ]; then
              grep -q 'VGA artwork: 256-color source pack' /tmp/micropol-smoke/AUTO.TXT
              grep -q 'VGA artwork: 256-color source pack' /tmp/micropol-smoke/FORCE.TXT
            fi
            grep -q 'City pan rate' /tmp/micropol-smoke/AUTO.TXT
            rm /tmp/micropol-smoke/AUTO.TXT /tmp/micropol-smoke/FORCE.TXT
          done

      - name: Upload hardware-test executable
        uses: actions/upload-artifact@v4
        with:
          name: micropolis-tandy-ex-dos
          path: |
            MICROPOL.EXE
            TILES.DAT
            NEWER1.DAT
            NEWERM8.DAT
            VGATILES.DAT
            VGANEWER.DAT
            VGA.PAL
            HAPPISLE.CTY
            micropolis-activity/COPYING
            tandy-dos/README.md
          if-no-files-found: error

  release:
    name: Publish latest Tandy DOS release and remove old releases
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: micropolis-tandy-release
      cancel-in-progress: false
    steps:
      - name: Download verified DOS build
        uses: actions/download-artifact@v4
        with:
          name: micropolis-tandy-ex-dos

      - name: Package DOS release
        shell: bash
        run: |
          set -euo pipefail
          test -s MICROPOL.EXE
          test -s TILES.DAT
          test -s HAPPISLE.CTY
          # The upstream GPL text is under micropolis-activity/,
          # not the repository root. Upload/download keeps this path.
          test -s micropolis-activity/COPYING
          test -s tandy-dos/README.md
          mkdir -p release/package
          cp MICROPOL.EXE TILES.DAT NEWER1.DAT NEWERM8.DAT VGATILES.DAT VGANEWER.DAT VGA.PAL HAPPISLE.CTY release/package/
          test ! -e release/package/SC2K.DAT
          cp micropolis-activity/COPYING release/package/COPYING
          cp tandy-dos/README.md release/package/README.md
          (
            cd release/package
            zip -q -9 ../MICROPOL-TANDY-DOS.zip \
              MICROPOL.EXE TILES.DAT NEWER1.DAT NEWERM8.DAT VGATILES.DAT VGANEWER.DAT VGA.PAL HAPPISLE.CTY README.md COPYING
          )
          unzip -t release/MICROPOL-TANDY-DOS.zip
          # Regression guard: legacy art filename must never ship.
          if unzip -Z -1 release/MICROPOL-TANDY-DOS.zip | grep -Fxq 'SC2K.DAT'; then
            echo "ERROR: obsolete SC2K.DAT found in release ZIP" >&2
            exit 1
          fi
          test -s release/package/NEWER1.DAT
          test -s release/package/NEWERM8.DAT

      - name: Publish new release, then completely delete older releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: tandy-dos-build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Do not touch old releases unless the fresh one is successfully
          # published with its verified build assets.
          gh release create "$RELEASE_TAG" \
            release/MICROPOL-TANDY-DOS.zip \
            release/package/MICROPOL.EXE \
            release/package/TILES.DAT \
            release/package/NEWER1.DAT \
            release/package/NEWERM8.DAT \
            release/package/VGATILES.DAT \
            release/package/VGANEWER.DAT \
            release/package/VGA.PAL \
            release/package/HAPPISLE.CTY \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Micropolis Tandy DOS Build #$GITHUB_RUN_NUMBER" \
            --notes "Successful Open Watcom 16-bit DOS build from master. Run #$GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT), commit $GITHUB_SHA. Includes MICROPOL.EXE, original TILES.DAT, unchanged 1x1 art and complete 2x2/3x3 NewerSource art, HAPPISLE.CTY and license." \
            --latest

          # Use paginated REST results so this cleans up ALL older
          # releases, not merely the first 30 or 100. --cleanup-tag
          # also deletes the release's Git tag; deleting a release
          # removes its associated assets as well.
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/micropolis-release-tags.txt"

          while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$RELEASE_TAG" ]]; then
              echo "Removing older release and tag: $old_tag"
              gh release delete "$old_tag" \
                --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done < "$RUNNER_TEMP/micropolis-release-tags.txt"

          # Make cleanup failure visible instead of claiming that old
          # releases were removed when the API denied the action.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          remaining="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name')"
          if [[ "$remaining" != "$RELEASE_TAG" ]]; then
            echo "::error::Old releases remain after cleanup: $remaining"
            exit 1
          fi
